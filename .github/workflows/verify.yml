name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-ci-placeholder
      SUPABASE_SERVICE_KEY: local-ci-placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        id: typecheck
        continue-on-error: true
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee typecheck.log

      - name: Production build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Publish verification summary
        if: always()
        run: |
          {
            echo "## Bracket Builder verification"
            echo
            echo "- TypeScript check: ${{ steps.typecheck.outcome }}"
            echo "- Production build: ${{ steps.build.outcome }}"
            echo
            echo "<details><summary>TypeScript output</summary>"
            echo
            echo '```text'
            tail -n 200 typecheck.log 2>/dev/null || true
            echo '```'
            echo "</details>"
            echo
            echo "<details><summary>Build output</summary>"
            echo
            echo '```text'
            tail -n 200 build.log 2>/dev/null || true
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce verification result
        if: steps.typecheck.outcome != 'success' || steps.build.outcome != 'success'
        run: |
          echo "One or more verification steps failed. Review the workflow summary."
          exit 1
